# Backend plan 17.3 (B00 part): check, build, dependency audit and secret scan.
# Actions are pinned by full commit SHA; the comment names the release.
name: CI

on:
  pull_request:
  push:
    # Feature-01 (the product) and Feature-02 (the demo) take direct pushes, so they are checked on every push too.
    branches: [main, Feature-01, Feature-02]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build reads the catalogue from PostgreSQL (the item, shop and category pages are prerendered), so a
    # throwaway database is migrated and seeded first. Its passwords exist only inside this job.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ceyliving_migrator
          POSTGRES_PASSWORD: ci_migrator
          POSTGRES_DB: ceyliving
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceyliving_migrator -d ceyliving"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgresql://ceyliving_migrator:ci_migrator@localhost:5432/ceyliving
      DATABASE_URL: postgresql://ceyliving_app:ci_app@localhost:5432/ceyliving
      # B05a: production builds check these at start-up. Build-only values: no email is sent and no session made in CI.
      BETTER_AUTH_SECRET: ci-build-only-${{ github.run_id }}-${{ github.run_attempt }}-not-a-secret
      SMTP_URL: smtp://127.0.0.1:1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks scans the full history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The tests start their own PostgreSQL with Testcontainers in the runner's Docker (each test file gets a copy).
      - run: npm run check

      # DB-10: the app user exists before the migration grants it data rights, as in every environment.
      - name: Prepare the build database
        run: |
          psql "$DATABASE_MIGRATION_URL" -c "CREATE ROLE ceyliving_app LOGIN PASSWORD 'ci_app'"
          npx prisma migrate deploy
          npm run db:seed

      - run: npm run build

      # Production dependencies must be clean. The dev-only ESLint findings are accepted for now (see README).
      - name: npm audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (all, report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
